[tool.poetry]
version = "0.1.0"
name = "cloud-migration-factory-on-aws"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
urllib3 = ">=2.7.0"
requests = "==2.32.4"
PyJWT = {extras = ["crypto"], version = "2.13.0"}
simplejson = "==3.20.1"
# Transitive pin: mitigate CVE-2026-69247 PKCS#7 Bleichenbacher oracle (fixed in 50.0.0); caret caps below next major
cryptography = "^50.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
version = "0.1.0"
name = "cloud-migration-factory-on-aws"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
urllib3 = ">=2.7.0"
requests = "==2.32.4"
simplejson = "==3.20.1"
boto3 = "^1.37.6"
botocore = "^1.37.6"
aws-lambda-powertools = {version = ">=3.7.0", extras = ["validation"]}
mypy-boto3-dynamodb = ">=1.37.0"
python-ulid = "^3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"